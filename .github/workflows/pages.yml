name: Deploy NVV Field Maps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose hosted FeatureStyle
        run: |
          curl -fsSL https://nvv-field-maps.bala-4984.chatgpt.site/app.js -o /tmp/host-app.js
          grep -n "FeatureStyle" /tmp/host-app.js || true
          curl -fsSL https://nvv-field-maps.bala-4984.chatgpt.site/trays.js -o /tmp/host-trays.js
          grep -n "FeatureStyle" /tmp/host-trays.js || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
